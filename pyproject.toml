[project]
name = "CQCParse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas"]

[dependency-groups]
dev = ["pytest", "ruff", "rich"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["CQCParse"]